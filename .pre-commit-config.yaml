repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.svg$|^README\.md$
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ensure-resume-artifacts-are-buildable
        name: Ensure resume artifacts are buildable
        entry: make build
        language: system
        files: ^(README\.md|Makefile|src/(pandoc|pandoc-html)\.yaml|src/pandoc-pdf-template\.html|src/resume\.css)$
        pass_filenames: false
