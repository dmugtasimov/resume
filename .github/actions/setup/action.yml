name: Setup
runs:
  using: "composite"
  steps:
    - name: Cache APT packages
      uses: actions/cache@v5
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-apt-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install prerequisites
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends curl git make sudo ca-certificates xz-utils

    - name: Disable Git's dubious ownership check
      shell: bash
      run: git config --global safe.directory '*'

    - name: Configure PATH for pipx
      shell: bash
      run: echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

    - name: Install dependencies
      shell: bash
      run: make setup
